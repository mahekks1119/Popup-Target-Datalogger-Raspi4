<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Range Console — Stage 1 POC</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header class="console-header">
    <div class="console-title">
      <span class="console-title__mark">◎</span>
      <h1>RANGE CONSOLE</h1>
    </div>
    <div class="conn" id="connStatus" data-state="disconnected">
      <span class="conn__dot"></span>
      <span class="conn__label">DISCONNECTED</span>
    </div>
  </header>

  <div class="connect-bar">
    <label for="wsUrl">Pi address</label>
    <input id="wsUrl" type="text" value="ws://msraspi4.local:8765" />
    <button id="connectBtn">Connect</button>
  </div>

  <main class="grid">

    <section class="panel panel--log">
      <h2>Incoming Data <span class="panel__hint">(typed at Pi terminal)</span></h2>
      <div id="dataLog" class="log" aria-live="polite">
        <p class="log__empty">Waiting for connection…</p>
      </div>
    </section>

    <section class="panel panel--motors">
      <h2>Target Rotation</h2>

      <div class="motor">
        <div class="motor__label">Motor A</div>
        <div class="motor__controls">
          <button class="motor-btn" data-motor="A" data-action="rotate_ccw">⟲ CCW</button>
          <button class="motor-btn motor-btn--stop" data-motor="A" data-action="stop">STOP</button>
          <button class="motor-btn" data-motor="A" data-action="rotate_cw">CW ⟳</button>
        </div>
        <div class="motor__status" id="statusA">idle</div>
      </div>

      <div class="motor">
        <div class="motor__label">Motor B</div>
        <div class="motor__controls">
          <button class="motor-btn" data-motor="B" data-action="rotate_ccw">⟲ CCW</button>
          <button class="motor-btn motor-btn--stop" data-motor="B" data-action="stop">STOP</button>
          <button class="motor-btn" data-motor="B" data-action="rotate_cw">CW ⟳</button>
        </div>
        <div class="motor__status" id="statusB">idle</div>
      </div>

      <p class="panel__note">No actuators wired yet — commands are logged on the Pi as stubs.</p>
    </section>

  </main>

  <script src="app.js"></script>
</body>
</html>
